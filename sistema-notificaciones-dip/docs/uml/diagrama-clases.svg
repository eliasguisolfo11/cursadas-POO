<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" role="img" aria-labelledby="title description">
  <title id="title">Diagrama UML de notificaciones con MVC, DAO y DIP</title>
  <desc id="description">El controlador coordina vista y servicio. El servicio depende de Mensajeria y NotificacionDAO. Los canales implementan Mensajeria y el DAO en memoria implementa NotificacionDAO.</desc>
  <defs>
    <style>
      .bg { fill: #f4f7fb; }
      .heading { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #14253d; }
      .subheading { font: 15px 'Segoe UI', Arial, sans-serif; fill: #58708b; }
      .package { fill: #eaf0f8; stroke: #cbd7e5; stroke-width: 1.4; }
      .package-label { font: 700 12px 'Segoe UI', Arial, sans-serif; letter-spacing: .08em; fill: #60748d; }
      .card { fill: #fff; stroke: #6d83a0; stroke-width: 1.5; rx: 9; }
      .accent-blue { fill: #256d85; }
      .accent-purple { fill: #7658a6; }
      .accent-green { fill: #3a806a; }
      .accent-amber { fill: #b47727; }
      .card-title { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #172b46; }
      .stereotype { font: italic 12px 'Segoe UI', Arial, sans-serif; fill: #55718b; }
      .member { font: 12px 'Cascadia Code', Consolas, monospace; fill: #344c66; }
      .divider { stroke: #d8e1ec; stroke-width: 1; }
      .line { fill: none; stroke: #536b85; stroke-width: 2; }
      .dashed { stroke-dasharray: 7 6; }
      .rel-label { font: 12px 'Segoe UI', Arial, sans-serif; fill: #526983; }
      .arrow { fill: #f4f7fb; stroke: #536b85; stroke-width: 2; }
      .note { font: 13px 'Segoe UI', Arial, sans-serif; fill: #526983; }
      .tag { fill: #e7f3f5; stroke: #bad9df; }
      .tag-text { font: 12px 'Segoe UI', Arial, sans-serif; fill: #225d6a; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 6 L 1 11 Z" class="arrow"/>
    </marker>
    <marker id="openTriangle" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7.5 L 1 14 Z" class="arrow"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="1110"/>
  <text class="heading" x="48" y="55">Sistema de notificaciones</text>
  <text class="subheading" x="48" y="82">Estructura MVC + DAO · Principio de Inversion de Dependencias</text>

  <!-- App -->
  <rect class="package" x="38" y="108" width="282" height="180" rx="12"/>
  <text class="package-label" x="56" y="134">APP / COMPOSICION</text>
  <rect class="card" x="58" y="151" width="242" height="116"/>
  <rect class="accent-blue" x="58" y="151" width="7" height="116" rx="3"/>
  <text class="card-title" x="80" y="181">Main</text>
  <line class="divider" x1="77" y1="193" x2="281" y2="193"/>
  <text class="member" x="80" y="218">+ main(args): void</text>
  <text class="member" x="80" y="244">+ conecta dependencias</text>

  <!-- Controller -->
  <rect class="package" x="350" y="108" width="360" height="180" rx="12"/>
  <text class="package-label" x="368" y="134">CONTROLLER</text>
  <rect class="card" x="370" y="151" width="320" height="116"/>
  <rect class="accent-purple" x="370" y="151" width="7" height="116" rx="3"/>
  <text class="card-title" x="392" y="181">NotificacionController</text>
  <line class="divider" x1="389" y1="193" x2="671" y2="193"/>
  <text class="member" x="392" y="218">- servicio: NotificacionService</text>
  <text class="member" x="392" y="244">- vista: ConsolaView</text>

  <!-- View -->
  <rect class="package" x="990" y="108" width="450" height="180" rx="12"/>
  <text class="package-label" x="1008" y="134">VIEW</text>
  <rect class="card" x="1010" y="151" width="410" height="116"/>
  <rect class="accent-green" x="1010" y="151" width="7" height="116" rx="3"/>
  <text class="card-title" x="1032" y="181">ConsolaView</text>
  <line class="divider" x1="1029" y1="193" x2="1401" y2="193"/>
  <text class="member" x="1032" y="218">+ mostrarRegistro(notificacion)</text>
  <text class="member" x="1032" y="244">+ mostrarHistorial(registros)</text>

  <!-- Service -->
  <rect class="package" x="350" y="330" width="360" height="220" rx="12"/>
  <text class="package-label" x="368" y="356">SERVICE</text>
  <rect class="card" x="370" y="373" width="320" height="158"/>
  <rect class="accent-blue" x="370" y="373" width="7" height="158" rx="3"/>
  <text class="card-title" x="392" y="403">NotificacionService</text>
  <line class="divider" x1="389" y1="415" x2="671" y2="415"/>
  <text class="member" x="392" y="440">- mensajeria: Mensajeria</text>
  <text class="member" x="392" y="463">- dao: NotificacionDAO</text>
  <line class="divider" x1="389" y1="476" x2="671" y2="476"/>
  <text class="member" x="392" y="500">+ notificar(mensaje): Notificacion</text>
  <text class="member" x="392" y="520">+ obtenerHistorial(): List</text>

  <!-- Model -->
  <rect class="package" x="38" y="365" width="282" height="168" rx="12"/>
  <text class="package-label" x="56" y="391">MODEL</text>
  <rect class="card" x="58" y="408" width="242" height="108"/>
  <rect class="accent-blue" x="58" y="408" width="7" height="108" rx="3"/>
  <text class="stereotype" x="80" y="430">&lt;&lt;record&gt;&gt;</text>
  <text class="card-title" x="80" y="453">Notificacion</text>
  <line class="divider" x1="77" y1="465" x2="281" y2="465"/>
  <text class="member" x="80" y="487">+ mensaje: String</text>
  <text class="member" x="80" y="507">+ creadaEn: Instant</text>

  <!-- DAO -->
  <rect class="package" x="990" y="330" width="450" height="198" rx="12"/>
  <text class="package-label" x="1008" y="356">DAO</text>
  <rect class="card" x="1010" y="373" width="410" height="138"/>
  <rect class="accent-amber" x="1010" y="373" width="7" height="138" rx="3"/>
  <text class="stereotype" x="1032" y="395">&lt;&lt;interface&gt;&gt;</text>
  <text class="card-title" x="1032" y="418">NotificacionDAO</text>
  <line class="divider" x1="1029" y1="430" x2="1401" y2="430"/>
  <text class="member" x="1032" y="454">+ guardar(notificacion): void</text>
  <text class="member" x="1032" y="480">+ listar(): List&lt;Notificacion&gt;</text>

  <rect class="package" x="990" y="580" width="450" height="158" rx="12"/>
  <text class="package-label" x="1008" y="606">DAO · IMPLEMENTACION EN MEMORIA</text>
  <rect class="card" x="1010" y="623" width="410" height="96"/>
  <rect class="accent-amber" x="1010" y="623" width="7" height="96" rx="3"/>
  <text class="card-title" x="1032" y="653">NotificacionDAOMemoria</text>
  <line class="divider" x1="1029" y1="665" x2="1401" y2="665"/>
  <text class="member" x="1032" y="691">- notificaciones: List&lt;Notificacion&gt;</text>

  <!-- Mensajeria contract -->
  <rect class="package" x="350" y="655" width="360" height="168" rx="12"/>
  <text class="package-label" x="368" y="681">MODEL · CONTRATO DIP</text>
  <rect class="card" x="370" y="698" width="320" height="108"/>
  <rect class="accent-blue" x="370" y="698" width="7" height="108" rx="3"/>
  <text class="stereotype" x="392" y="720">&lt;&lt;interface&gt;&gt;</text>
  <text class="card-title" x="392" y="743">Mensajeria</text>
  <line class="divider" x1="389" y1="755" x2="671" y2="755"/>
  <text class="member" x="392" y="781">+ enviar(mensaje): void</text>

  <!-- Executor -->
  <rect class="tag" x="740" y="655" width="230" height="130" rx="9"/>
  <text class="stereotype" x="758" y="681">&lt;&lt;java.util.concurrent&gt;&gt;</text>
  <text class="card-title" x="758" y="708">Executor</text>
  <text class="member" x="758" y="735">- inyectado al composite</text>
  <text class="member" x="758" y="760">- ejecuta en paralelo</text>

  <!-- Channel adapters -->
  <rect class="package" x="28" y="875" width="1444" height="170" rx="12"/>
  <text class="package-label" x="48" y="901">MODEL · CANALES</text>

  <rect class="card" x="40" y="915" width="220" height="112"/>
  <rect class="accent-blue" x="40" y="915" width="7" height="112" rx="3"/>
  <text class="card-title" x="62" y="946">Email</text>
  <line class="divider" x1="59" y1="958" x2="241" y2="958"/>
  <text class="member" x="62" y="984">+ enviar(mensaje)</text>
  <text class="member" x="62" y="1008">simula correo</text>

  <rect class="card" x="300" y="915" width="220" height="112"/>
  <rect class="accent-blue" x="300" y="915" width="7" height="112" rx="3"/>
  <text class="card-title" x="322" y="946">WhatsApp</text>
  <line class="divider" x1="319" y1="958" x2="501" y2="958"/>
  <text class="member" x="322" y="984">+ enviar(mensaje)</text>
  <text class="member" x="322" y="1008">simula WhatsApp</text>

  <rect class="card" x="560" y="915" width="220" height="112"/>
  <rect class="accent-blue" x="560" y="915" width="7" height="112" rx="3"/>
  <text class="card-title" x="582" y="946">SMS</text>
  <line class="divider" x1="579" y1="958" x2="761" y2="958"/>
  <text class="member" x="582" y="984">+ enviar(mensaje)</text>
  <text class="member" x="582" y="1008">simula SMS</text>

  <rect class="card" x="820" y="915" width="220" height="112"/>
  <rect class="accent-blue" x="820" y="915" width="7" height="112" rx="3"/>
  <text class="card-title" x="842" y="946">Push</text>
  <line class="divider" x1="839" y1="958" x2="1021" y2="958"/>
  <text class="member" x="842" y="984">+ enviar(mensaje)</text>
  <text class="member" x="842" y="1008">simula push</text>

  <rect class="card" x="1110" y="915" width="330" height="112"/>
  <rect class="accent-blue" x="1110" y="915" width="7" height="112" rx="3"/>
  <text class="card-title" x="1132" y="946">MensajeriaMultiple</text>
  <line class="divider" x1="1129" y1="958" x2="1421" y2="958"/>
  <text class="member" x="1132" y="984">- canales: List&lt;Mensajeria&gt;</text>
  <text class="member" x="1132" y="1008">- executor: Executor</text>

  <!-- Relationships are drawn over package backgrounds and stop at class borders. -->
  <path class="line dashed" d="M 300 170 L 363 170" marker-end="url(#arrow)"/>
  <path class="line" d="M 530 267 L 530 365" marker-end="url(#arrow)"/>
  <path class="line" d="M 690 183 L 1003 183" marker-end="url(#arrow)"/>
  <path class="line dashed" d="M 690 415 L 1003 415" marker-end="url(#arrow)"/>
  <path class="line" d="M 530 531 L 530 690" marker-end="url(#arrow)"/>
  <path class="line dashed" d="M 370 493 L 308 493" marker-end="url(#arrow)"/>
  <path class="line dashed" d="M 1200 623 L 1200 518" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 150 915 L 150 875 L 375 875 L 375 802" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 410 915 L 410 860 L 450 860 L 450 802" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 670 915 L 670 845 L 525 845 L 525 802" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 930 915 L 930 830 L 600 830 L 600 802" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 1275 915 L 1275 820 L 675 820 L 675 802" marker-end="url(#openTriangle)"/>
  <path class="line dashed" d="M 1275 915 L 1275 805 L 855 805 L 855 793" marker-end="url(#arrow)"/>

  <text class="rel-label" x="74" y="862">implementan</text>
  <text class="rel-label" x="1010" y="798">delegacion concurrente</text>
  <text class="note" x="48" y="1080">El DAO en memoria guarda el historial durante la ejecucion; puede reemplazarse por otro DAO sin cambiar el servicio.</text>
</svg>
